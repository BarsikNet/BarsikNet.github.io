<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>BarsikNet 3.0 — Социальная сеть</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
        body { background: linear-gradient(145deg, #f7b05e 0%, #f28c38 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px; }
        .app-container { width: 100%; max-width: 1400px; height: 90vh; background: rgba(255, 248, 225, 0.25); backdrop-filter: blur(20px); border-radius: 48px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); overflow: hidden; display: flex; flex-direction: column; }
        .main-content { flex: 1; overflow-y: auto; padding: 20px; }
        .fullscreen-chat { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255, 245, 225, 0.98); backdrop-filter: blur(20px); z-index: 1000; display: flex; flex-direction: column; padding: 20px; }
        .fullscreen-chat .chat-header { display: flex; align-items: center; gap: 16px; padding: 16px; background: rgba(255, 200, 120, 0.5); border-radius: 32px; margin-bottom: 16px; flex-wrap: wrap; }
        .fullscreen-chat .chat-messages-area { flex: 1; overflow-y: auto; padding: 16px; }
        .fullscreen-chat .chat-input-area { padding: 16px; display: flex; gap: 12px; }
        .tab-bar { background: rgba(30, 20, 15, 0.5); backdrop-filter: blur(30px); border-top: 1px solid rgba(255, 215, 150, 0.6); display: flex; justify-content: space-around; padding: 12px 16px 20px; gap: 8px; }
        .tab-item { flex: 1; text-align: center; color: #fff7e8; font-size: 13px; font-weight: 600; padding: 8px 0; border-radius: 32px; cursor: pointer; background: rgba(255, 200, 120, 0.2); transition: 0.1s; }
        .tab-item i { display: block; font-size: 22px; margin-bottom: 4px; }
        .tab-item.active { background: #f57c00; color: white; box-shadow: 0 6px 14px rgba(0,0,0,0.2); }
        .auth-panel { background: rgba(255,245,225,0.9); border-radius: 40px; padding: 32px 24px; max-width: 480px; margin: 10% auto; }
        input, button, textarea { border: none; outline: none; border-radius: 60px; padding: 14px 18px; font-size: 16px; width: 100%; margin-top: 12px; background: rgba(255,255,240,0.9); }
        button { background: #f57c00; color: white; font-weight: bold; cursor: pointer; transition: 0.1s; }
        button:active { transform: scale(0.97); }
        .card { background: rgba(255, 235, 205, 0.85); border-radius: 32px; padding: 16px; margin-bottom: 16px; border: 1px solid rgba(255,160,50,0.6); }
        .avatar-circle { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; flex-shrink: 0; }
        .avatar-sm { width: 40px; height: 40px; font-size: 24px; }
        .online-status { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-left: 8px; }
        .online { background: #2ecc71; }
        .offline { background: #95a5a6; }
        .post-card { margin-bottom: 24px; }
        .post-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .post-actions { display: flex; gap: 24px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #ffcc88; }
        .post-actions button { width: auto; background: transparent; color: #f57c00; margin: 0; padding: 8px 16px; cursor: pointer; }
        .comments-section { margin-top: 12px; padding-left: 20px; border-left: 2px solid #f57c00; }
        .filter-buttons { display: flex; gap: 12px; margin-bottom: 20px; }
        .filter-btn { background: #ffd8a8; color: #4a2a0e; width: auto; padding: 8px 24px; cursor: pointer; }
        .filter-btn.active { background: #f57c00; color: white; }
        .verif-badge { color: #3498db; margin-left: 6px; font-size: 14px; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .channel-message { background: #ffe5c4; border-radius: 20px; padding: 12px; margin-bottom: 16px; }
        .channel-msg-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .msg-author-name { font-weight: 600; font-size: 14px; color: #4a2a0e; }
        .msg-time { font-size: 10px; color: #8b6914; margin-left: 8px; }
        .msg-text { font-size: 15px; margin: 8px 0; word-break: break-word; }
        .msg-actions { display: flex; gap: 16px; margin-top: 8px; padding-top: 8px; border-top: 1px solid #ffcc88; }
        .msg-actions button { width: auto; background: transparent; color: #f57c00; margin: 0; padding: 6px 12px; font-size: 13px; cursor: pointer; }
        .channel-comment { margin-left: 40px; padding: 8px; background: #fff5e8; border-radius: 16px; margin-top: 8px; }
        @media (min-width: 1024px) { .app-container { width: 1000px; height: 85vh; } }
        @media (max-width: 600px) { .tab-item span { font-size: 10px; } .tab-item i { font-size: 18px; } }
        .toast-msg { position: fixed; bottom: 20px; left: 20px; background: #2c3e2f; color: white; padding: 10px 20px; border-radius: 50px; z-index: 999; font-size: 13px; }
        .msg-bubble { background: #f2a65a; border-radius: 24px; padding: 10px 14px; max-width: 70%; }
        .no-click { cursor: default; }
        .dialog-card { cursor: pointer; }
    </style>
</head>
<body>
<div class="app-container" id="appRoot"></div>

<script>
    const firebaseConfig = { databaseURL: "https://onlinesm1-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentUser = null;
    let activeTab = 'dialogs';
    let currentChatUserId = null;
    let currentChannelId = null;
    let currentGroupId = null;
    let channelSearchResults = null;
    let postsFilter = 'new';
    let postDraft = '';
    let commentDrafts = {};
    let chatDraft = '';
    let channelCommentDrafts = {};
    let currentMessagesRef = null;
    let dialogsCache = null;
    let dialogsCacheTime = 0;
    let isLoading = false;

    function showToast(msg) {
        let toast = document.createElement('div');
        toast.className = 'toast-msg';
        toast.innerText = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    }

    function getUserId(username) { return username.toLowerCase().replace(/[^a-z0-9]/g, ''); }
    
    function saveSession(user) {
        if(user) localStorage.setItem('barsik_session', JSON.stringify({ userId: user.userId }));
        else localStorage.removeItem('barsik_session');
    }

    function initPresence(userId) {
        const userStatusRef = db.ref(`/users/${userId}/online`);
        const connectedRef = db.ref('.info/connected');
        connectedRef.on('value', (snap) => {
            if(snap.val() === true) {
                userStatusRef.onDisconnect().set(false);
                userStatusRef.set(true);
            }
        });
    }

    async function registerUser(nickname, username, password) {
        const usersRef = db.ref('users');
        const snapshot = await usersRef.orderByChild('username').equalTo(username).once('value');
        if(snapshot.exists()) throw new Error('Юзернейм уже занят');
        const userId = getUserId(username);
        const newUser = { userId, nickname, username, password, avatarIcon: '🐱', avatarBg: '#ffb347', verified: false, online: true, createdAt: Date.now() };
        await usersRef.child(userId).set(newUser);
        return newUser;
    }

    async function loginUser(username, password) {
        const usersRef = db.ref('users');
        const snapshot = await usersRef.orderByChild('username').equalTo(username).once('value');
        if(!snapshot.exists()) throw new Error('Пользователь не найден');
        let userData = null;
        snapshot.forEach(child => { userData = child.val(); });
        if(userData.password !== password) throw new Error('Неверный пароль');
        return userData;
    }

    async function restoreSession() {
        const saved = localStorage.getItem('barsik_session');
        if(!saved) return null;
        const { userId } = JSON.parse(saved);
        const snap = await db.ref(`users/${userId}`).once('value');
        return snap.exists() ? snap.val() : null;
    }

    async function searchUsers(query) {
        const usersSnap = await db.ref('users').orderByChild('username').equalTo(query).once('value');
        let users = [];
        usersSnap.forEach(u => { if(u.val().userId !== currentUser.userId) users.push(u.val()); });
        return users;
    }

    async function searchChannels(query) {
        const channelsSnap = await db.ref('channels').orderByChild('username').equalTo(query).once('value');
        let channels = [];
        channelsSnap.forEach(ch => channels.push(ch.val()));
        return channels;
    }

    async function checkChannelUsername(username) {
        const snapshot = await db.ref('channels').orderByChild('username').equalTo(username).once('value');
        return snapshot.exists();
    }

    async function checkGroupUsername(username) {
        const snapshot = await db.ref('groups').orderByChild('username').equalTo(username).once('value');
        return snapshot.exists();
    }

    async function getDialogs() {
        if(dialogsCache && (Date.now() - dialogsCacheTime) < 2000) {
            return dialogsCache;
        }
        
        const chatsRef = db.ref('chats');
        const snapshot = await chatsRef.once('value');
        const dialogs = [];
        if(!snapshot.val()) return dialogs;
        
        const promises = [];
        for(let chatId of Object.keys(snapshot.val())) {
            if(chatId.includes(currentUser.userId)) {
                const parts = chatId.split('_');
                const otherId = parts[0] === currentUser.userId ? parts[1] : parts[0];
                promises.push((async () => {
                    const userSnap = await db.ref(`users/${otherId}`).once('value');
                    if(userSnap.exists()) {
                        const user = userSnap.val();
                        let lastMessage = '';
                        let lastTime = 0;
                        const messagesSnap = await db.ref(`chats/${chatId}/messages`).once('value');
                        if(messagesSnap.val()) {
                            const msgs = Object.values(messagesSnap.val());
                            const lastMsg = msgs[msgs.length - 1];
                            if(lastMsg) { lastTime = lastMsg.timestamp; lastMessage = lastMsg.text; }
                        }
                        dialogs.push({ userId: otherId, nickname: user.nickname, username: user.username, avatarIcon: user.avatarIcon, avatarBg: user.avatarBg, verified: user.verified, lastMessage: lastMessage || 'Напишите первое сообщение', lastTime: lastTime });
                    }
                })());
            }
        }
        await Promise.all(promises);
        dialogs.sort((a,b) => (b.lastTime || 0) - (a.lastTime || 0));
        dialogsCache = dialogs;
        dialogsCacheTime = Date.now();
        return dialogs;
    }

    async function sendPrivateMessage(toUserId, text) {
        if(!text.trim()) return;
        const chatId = [currentUser.userId, toUserId].sort().join('_');
        const chatExists = await db.ref(`chats/${chatId}`).once('value');
        if(!chatExists.exists()) await db.ref(`chats/${chatId}`).set({ createdAt: Date.now() });
        await db.ref(`chats/${chatId}/messages`).push({ from: currentUser.userId, fromName: currentUser.nickname, text: text.trim(), timestamp: Date.now() });
        dialogsCache = null;
        showToast('💬 Сообщение отправлено');
    }

    async function sendChannelMessage(channelId, userId, text) {
        const chanSnap = await db.ref(`channels/${channelId}`).once('value');
        if(chanSnap.val().ownerId !== userId) throw new Error('Только владелец может писать');
        const msgId = Date.now().toString();
        await db.ref(`channels/${channelId}/messages/${msgId}`).set({ 
            msgId, from: userId, fromName: currentUser.nickname, text, timestamp: Date.now(), comments: {}, commentsCount: 0
        });
        showToast('📢 Сообщение опубликовано');
    }

    async function addChannelComment(channelId, msgId, text) {
        if(!text.trim()) { showToast('💬 Напишите комментарий'); return; }
        const commentId = 'cmt_' + Date.now();
        const comment = { 
            commentId, userId: currentUser.userId, userName: currentUser.nickname, text: text.trim(), timestamp: Date.now()
        };
        await db.ref(`channels/${channelId}/messages/${msgId}/comments/${commentId}`).set(comment);
        const commentsSnap = await db.ref(`channels/${channelId}/messages/${msgId}/comments`).once('value');
        const count = commentsSnap.exists() ? commentsSnap.numChildren() : 0;
        await db.ref(`channels/${channelId}/messages/${msgId}/commentsCount`).set(count);
        showToast('💬 Комментарий добавлен');
    }

    async function sendGroupMessage(groupId, userId, text) {
        const grpSnap = await db.ref(`groups/${groupId}`).once('value');
        if(!grpSnap.val().members[userId]) throw new Error('Вы не участник');
        await db.ref(`groups/${groupId}/messages`).push({ from: userId, fromName: currentUser.nickname, text, timestamp: Date.now() });
        showToast('👥 Сообщение отправлено');
    }

    async function createChannel(channelName, channelUsername, ownerId) {
        const exists = await checkChannelUsername(channelUsername);
        if(exists) { showToast('❌ Юзернейм канала уже занят'); return null; }
        const chanId = 'chan_' + Date.now();
        await db.ref(`channels/${chanId}`).set({ channelId: chanId, name: channelName, username: channelUsername, ownerId: ownerId, subscribers: { [ownerId]: true }, verified: false });
        showToast('📺 Канал создан');
        return chanId;
    }

    async function subscribeToChannel(channelId, userId) { await db.ref(`channels/${channelId}/subscribers/${userId}`).set(true); showToast('🔔 Подписка оформлена'); }

    async function createGroup(groupName, groupUsername, ownerId) {
        const exists = await checkGroupUsername(groupUsername);
        if(exists) { showToast('❌ Юзернейм группы уже занят'); return null; }
        const groupId = 'grp_' + Date.now();
        await db.ref(`groups/${groupId}`).set({ groupId, name: groupName, username: groupUsername, ownerId, members: { [ownerId]: true } });
        showToast('👥 Группа создана');
        return groupId;
    }

    async function addMemberToGroup(groupId, memberUserId) { await db.ref(`groups/${groupId}/members/${memberUserId}`).set(true); showToast('👥 Участник добавлен'); }

    async function createPost(text) {
        if(!text.trim()) { showToast('📝 Напишите текст поста'); return false; }
        const postId = 'post_' + Date.now();
        await db.ref(`posts/${postId}`).set({ postId, authorId: currentUser.userId, authorName: currentUser.nickname, authorUsername: currentUser.username, authorAvatar: currentUser.avatarIcon, authorBg: currentUser.avatarBg, authorVerified: currentUser.verified || false, text: text.trim(), timestamp: Date.now(), likesCount: 0, comments: {}, commentsCount: 0 });
        showToast('✅ Пост опубликован!');
        return true;
    }

    async function toggleLike(postId) {
        const likeRef = db.ref(`posts/${postId}/likes/${currentUser.userId}`);
        const snapshot = await likeRef.once('value');
        if(snapshot.exists()) await likeRef.remove();
        else await likeRef.set(true);
        const likesSnap = await db.ref(`posts/${postId}/likes`).once('value');
        await db.ref(`posts/${postId}/likesCount`).set(likesSnap.exists() ? likesSnap.numChildren() : 0);
    }

    async function addPostComment(postId, text) {
        if(!text.trim()) { showToast('💬 Напишите комментарий'); return; }
        const commentId = 'cmt_' + Date.now();
        await db.ref(`posts/${postId}/comments/${commentId}`).set({ commentId, userId: currentUser.userId, userName: currentUser.nickname, text: text.trim(), timestamp: Date.now() });
        const commentsSnap = await db.ref(`posts/${postId}/comments`).once('value');
        await db.ref(`posts/${postId}/commentsCount`).set(commentsSnap.exists() ? commentsSnap.numChildren() : 0);
        showToast('💬 Комментарий добавлен');
    }

    async function getPosts(order = 'new') {
        const snapshot = await db.ref('posts').once('value');
        let posts = [];
        snapshot.forEach(p => posts.push(p.val()));
        if(order === 'new') posts.sort((a,b) => b.timestamp - a.timestamp);
        else posts.sort((a,b) => (b.likesCount || 0) - (a.likesCount || 0));
        return posts;
    }

    async function updateUserAvatar(icon, bgColor) {
        await db.ref(`users/${currentUser.userId}/avatarIcon`).set(icon);
        await db.ref(`users/${currentUser.userId}/avatarBg`).set(bgColor);
        currentUser.avatarIcon = icon;
        currentUser.avatarBg = bgColor;
        showToast('🎨 Аватар обновлён');
    }

    function renderAvatar(icon, bgColor, sizeClass = '') {
        return `<div class="avatar-circle ${sizeClass}" style="background-color: ${bgColor || '#ffb347'};">${icon || '🐱'}</div>`;
    }

    async function renderApp() {
        if(isLoading) return;
        isLoading = true;
        
        const root = document.getElementById('appRoot');
        if(!currentUser) {
            root.innerHTML = `<div class="auth-panel"><h2 style="text-align:center">🐾 BarsikNet 3.0</h2><div style="display:flex; gap:10px; margin:20px 0;"><button id="showLoginBtn">Вход</button><button id="showRegBtn">Регистрация</button></div><div id="authForm"><input type="text" id="loginUsername" placeholder="Юзернейм"><input type="password" id="loginPassword" placeholder="Пароль"><button id="doLoginBtn">Войти</button></div></div>`;
            
            const showLogin = () => {
                document.getElementById('authForm').innerHTML = `<input type="text" id="loginUsername" placeholder="Юзернейм"><input type="password" id="loginPassword" placeholder="Пароль"><button id="doLoginBtn">Войти</button>`;
                document.getElementById('doLoginBtn')?.addEventListener('click', async () => {
                    try { currentUser = await loginUser(document.getElementById('loginUsername').value, document.getElementById('loginPassword').value); saveSession(currentUser); initPresence(currentUser.userId); renderApp(); } 
                    catch(e) { showToast(e.message); }
                });
            };
            const showReg = () => {
                document.getElementById('authForm').innerHTML = `<input type="text" id="regNick" placeholder="Никнейм"><input type="text" id="regUsername" placeholder="Юзернейм"><input type="password" id="regPassword" placeholder="Пароль"><button id="doRegBtn">Зарегистрироваться</button>`;
                document.getElementById('doRegBtn')?.addEventListener('click', async () => {
                    try { currentUser = await registerUser(document.getElementById('regNick').value, document.getElementById('regUsername').value, document.getElementById('regPassword').value); saveSession(currentUser); initPresence(currentUser.userId); renderApp(); } 
                    catch(e) { showToast(e.message); }
                });
            };
            document.getElementById('showLoginBtn')?.addEventListener('click', showLogin);
            document.getElementById('showRegBtn')?.addEventListener('click', showReg);
            isLoading = false;
            return;
        }

        let mainView = '';
        if(activeTab === 'posts') mainView = await renderPostsTab();
        else if(activeTab === 'dialogs') mainView = await renderDialogsTab();
        else if(activeTab === 'channels') mainView = await renderChannelsTab();
        else if(activeTab === 'groups') mainView = await renderGroupsTab();
        else if(activeTab === 'channelSearch') mainView = await renderChannelSearchTab();
        else if(activeTab === 'settings') mainView = renderSettingsTab();
        
        root.innerHTML = `<div class="main-content" id="mainContent">${mainView}</div><div class="tab-bar"><div class="tab-item ${activeTab==='posts'?'active':''}" data-tab="posts"><i class="fas fa-newspaper"></i><span>Посты</span></div><div class="tab-item ${activeTab==='dialogs'?'active':''}" data-tab="dialogs"><i class="fas fa-comments"></i><span>Диалоги</span></div><div class="tab-item ${activeTab==='channels'?'active':''}" data-tab="channels"><i class="fas fa-bullhorn"></i><span>Каналы</span></div><div class="tab-item ${activeTab==='groups'?'active':''}" data-tab="groups"><i class="fas fa-users"></i><span>Группы</span></div><div class="tab-item ${activeTab==='channelSearch'?'active':''}" data-tab="channelSearch"><i class="fas fa-search"></i><span>Поиск каналов</span></div><div class="tab-item ${activeTab==='settings'?'active':''}" data-tab="settings"><i class="fas fa-cog"></i><span>Настройки</span></div></div>`;
        
        document.querySelectorAll('.tab-item').forEach(tab => {
            tab.addEventListener('click', (e) => {
                e.stopPropagation();
                if(currentMessagesRef) { currentMessagesRef.off(); currentMessagesRef = null; }
                activeTab = tab.dataset.tab;
                currentChatUserId = null;
                currentChannelId = null;
                currentGroupId = null;
                renderApp();
            });
        });
        
        attachEvents();
        isLoading = false;
    }

    async function renderPostsTab() {
        const posts = await getPosts(postsFilter);
        let postsHtml = '';
        for(let post of posts) {
            const userLiked = post.likes && post.likes[currentUser.userId];
            const commentsCount = post.commentsCount || 0;
            
            postsHtml += `<div class="card post-card no-click"><div class="post-header">${renderAvatar(post.authorAvatar, post.authorBg, 'avatar-sm')}<div><strong>${post.authorName}</strong> @${post.authorUsername} ${post.authorVerified ? '<i class="fas fa-check-circle verif-badge"></i>' : ''}<div style="font-size: 12px;">${new Date(post.timestamp).toLocaleString()}</div></div></div><p>${post.text}</p><div class="post-actions"><button class="like-btn" data-post-id="${post.postId}"><i class="fas fa-heart" style="${userLiked ? 'color:#e74c3c' : ''}"></i> ${post.likesCount || 0}</button><button class="comment-toggle-btn" data-post-id="${post.postId}"><i class="fas fa-comment"></i> Комментарии (${commentsCount})</button></div><div class="comments-section" id="comments-${post.postId}" style="display: none;"><div id="comments-list-${post.postId}"></div><div class="flex-between" style="margin-top: 12px;"><input type="text" id="comment-input-${post.postId}" placeholder="Ваш комментарий..." value="${commentDrafts[post.postId] || ''}"><button class="add-post-comment-btn" data-post-id="${post.postId}" style="width: auto;">→</button></div></div></div>`;
            
            const commentsSnap = await db.ref(`posts/${post.postId}/comments`).once('value');
            const commentsList = document.getElementById(`comments-list-${post.postId}`);
            if(commentsSnap.val()) {
                const comments = Object.values(commentsSnap.val());
                comments.sort((a,b) => a.timestamp - b.timestamp);
                comments.forEach(c => {
                    if(commentsList) commentsList.innerHTML += `<div style="margin: 8px 0;"><strong>${c.userName}</strong>: ${c.text}</div>`;
                });
            } else if(commentsList) {
                commentsList.innerHTML = '<i>💬 Нет комментариев</i>';
            }
        }
        return `<div class="filter-buttons"><button class="filter-btn ${postsFilter === 'new' ? 'active' : ''}" data-filter="new">📅 Новые</button><button class="filter-btn ${postsFilter === 'popular' ? 'active' : ''}" data-filter="popular">🔥 Популярные</button></div><div class="card no-click"><textarea id="newPostText" rows="3" placeholder="Что нового? 🐱">${postDraft}</textarea><button id="createPostBtn">📝 Опубликовать</button></div><div id="postsList">${postsHtml || '<div class="card no-click">📭 Нет постов</div>'}</div>`;
    }

    async function renderDialogsTab() {
        if(currentChatUserId) return await renderFullscreenChat('pm');
        const dialogs = await getDialogs();
        let dialogsHtml = `<div class="card no-click"><input type="text" id="userSearchInput" placeholder="🔍 Поиск людей по юзернейму..." style="margin-top: 0;"><button id="searchUsersBtn">Найти пользователя</button></div><div id="userSearchResults"></div><h3 style="margin-top: 20px;">💬 Мои диалоги</h3>`;
        if(dialogs.length === 0) dialogsHtml += '<div class="card no-click">📭 У вас пока нет диалогов. Найдите человека выше и напишите ему!</div>';
        else {
            for(let dialog of dialogs) {
                const status = (await db.ref(`users/${dialog.userId}/online`).once('value')).val();
                dialogsHtml += `<div class="card dialog-card"><div style="display: flex; align-items: center; gap: 12px;">${renderAvatar(dialog.avatarIcon, dialog.avatarBg, 'avatar-sm')}<div style="flex:1"><strong>${dialog.nickname}</strong> @${dialog.username} ${dialog.verified ? '<i class="fas fa-check-circle verif-badge"></i>' : ''}<div style="font-size: 12px; color: #6b4c2a;">${dialog.lastMessage.substring(0, 50)}</div><span class="online-status ${status ? 'online' : 'offline'}"></span> ${status ? 'В сети' : 'Не в сети'}</div><button class="openChatBtn" data-userid="${dialog.userId}">💬</button></div></div>`;
            }
        }
        return `<h2>💬 Диалоги</h2><div id="dialogsContainer">${dialogsHtml}</div>`;
    }

    async function renderChannelsTab() {
        if(currentChannelId) return await renderFullscreenChat('channel');
        const channelsSnap = await db.ref('channels').once('value');
        let channels = [];
        if(channelsSnap.val()) Object.values(channelsSnap.val()).forEach(ch => channels.push(ch));
        const mySubs = channels.filter(c => c.subscribers && c.subscribers[currentUser.userId]);
        return `<h2>📺 Мои каналы</h2>${mySubs.map(c => `<div class="card"><strong>📢 ${c.name}</strong> @${c.username}<br><button class="openChannelBtn" data-id="${c.channelId}">Открыть</button></div>`).join('')}<div class="card no-click"><h3>✨ Создать канал</h3><input id="newChanName" placeholder="Название канала"><input id="newChanUsername" placeholder="Юзернейм канала"><button id="createChanBtn">Создать канал</button></div>`;
    }

    async function renderGroupsTab() {
        if(currentGroupId) return await renderFullscreenChat('group');
        const groupsSnap = await db.ref('groups').once('value');
        let groups = [];
        if(groupsSnap.val()) Object.values(groupsSnap.val()).forEach(g => groups.push(g));
        const myGroups = groups.filter(g => g.members && g.members[currentUser.userId]);
        return `<h2>👥 Мои группы</h2>${myGroups.map(g => `<div class="card"><strong>👥 ${g.name}</strong> @${g.username}<br><button class="openGroupBtn" data-id="${g.groupId}">Войти</button></div>`).join('')}<div class="card no-click"><h3>✨ Создать группу</h3><input id="newGrpName" placeholder="Название группы"><input id="newGrpUsername" placeholder="Юзернейм группы"><button id="createGrpBtn">Создать группу</button></div>`;
    }

    async function renderChannelSearchTab() {
        let channelsHtml = '';
        if(channelSearchResults && channelSearchResults.length > 0) channelsHtml = `<h4>📢 Результаты поиска:</h4>${channelSearchResults.map(c => `<div class="card flex-between"><div><strong>📢 ${c.name}</strong> @${c.username} ${c.verified ? '<i class="fas fa-check-circle verif-badge"></i>' : ''}</div><button class="subChannelBtn" data-id="${c.channelId}">🔔 Подписаться</button></div>`).join('')}`;
        return `<h2>🔍 Поиск каналов</h2><div class="card no-click"><input id="channelSearchInput" placeholder="Поиск каналов по юзернейму..." style="margin-top: 0;"><button id="searchChannelsBtn">Найти канал</button></div><div id="channelSearchResults">${channelsHtml}</div>`;
    }

    async function renderFullscreenChat(type) {
        let title = '', target = null, avatarHtml = '';
        if(type === 'pm') {
            const targetSnap = await db.ref(`users/${currentChatUserId}`).once('value');
            target = targetSnap.val();
            if(!target) { showToast('❌ Пользователь не найден'); currentChatUserId = null; renderApp(); return ''; }
            title = `${target.nickname} @${target.username}`;
            avatarHtml = renderAvatar(target.avatarIcon, target.avatarBg, 'avatar-sm');
        } else if(type === 'channel') {
            const chanSnap = await db.ref(`channels/${currentChannelId}`).once('value');
            target = chanSnap.val();
            title = `📺 ${target.name}`;
        } else if(type === 'group') {
            const grpSnap = await db.ref(`groups/${currentGroupId}`).once('value');
            target = grpSnap.val();
            title = `👥 ${target.name}`;
        }
        
        if(currentMessagesRef) { currentMessagesRef.off(); currentMessagesRef = null; }
        
        setTimeout(() => {
            const msgDiv = document.getElementById('fullscreenMsgList');
            if(!msgDiv) return;
            
            let messagesRef = null;
            if(type === 'pm') messagesRef = db.ref(`chats/${[currentUser.userId, currentChatUserId].sort().join('_')}/messages`);
            else if(type === 'channel') messagesRef = db.ref(`channels/${currentChannelId}/messages`);
            else if(type === 'group') messagesRef = db.ref(`groups/${currentGroupId}/messages`);
            
            if(!messagesRef) return;
            
            messagesRef.off();
            messagesRef.on('value', async (snapshot) => {
                const msgs = [];
                snapshot.forEach(child => { msgs.push({ id: child.key, ...child.val() }); });
                msgs.sort((a,b) => a.timestamp - b.timestamp);
                
                if(msgs.length === 0) {
                    msgDiv.innerHTML = '<div style="text-align: center; color: #6b4c2a; margin-top: 20px;">💬 Напишите первое сообщение</div>';
                } else {
                    if(type === 'pm') {
                        msgDiv.innerHTML = msgs.map(m => `<div style="display: flex; justify-content: ${m.from === currentUser.userId ? 'flex-end' : 'flex-start'}; margin: 8px 0;"><div class="msg-bubble" style="background: ${m.from === currentUser.userId ? '#faa75e' : '#ffe1b3'}">${m.text}<br><small>${new Date(m.timestamp).toLocaleTimeString()}</small></div></div>`).join('');
                    } else if(type === 'channel') {
                        msgDiv.innerHTML = '';
                        for(let m of msgs) {
                            const commentsCount = m.commentsCount || 0;
                            msgDiv.innerHTML += `<div class="channel-message"><div class="channel-msg-header">${renderAvatar(m.fromName, '#ffb347', 'avatar-sm')}<div><span class="msg-author-name">${m.fromName || m.from}</span><span class="msg-time">${new Date(m.timestamp).toLocaleString()}</span></div></div><div class="msg-text">${m.text}</div><div class="msg-actions"><button class="channel-comment-toggle" data-msg-id="${m.msgId || m.id}"><i class="fas fa-comment"></i> Комментарии (${commentsCount})</button></div><div class="comments-section" id="channel-comments-${m.msgId || m.id}" style="display: none;"><div id="channel-comments-list-${m.msgId || m.id}"></div><div class="flex-between" style="margin-top: 12px;"><input type="text" id="channel-comment-input-${m.msgId || m.id}" placeholder="Ваш комментарий..." value="${channelCommentDrafts[m.msgId || m.id] || ''}"><button class="add-channel-comment-btn" data-msg-id="${m.msgId || m.id}" style="width: auto;">→</button></div></div></div>`;
                            
                            const commentsSnap = await db.ref(`channels/${currentChannelId}/messages/${m.msgId || m.id}/comments`).once('value');
                            const commentsList = document.getElementById(`channel-comments-list-${m.msgId || m.id}`);
                            if(commentsSnap.val()) {
                                const comments = Object.values(commentsSnap.val());
                                comments.sort((a,b) => a.timestamp - b.timestamp);
                                comments.forEach(c => {
                                    if(commentsList) commentsList.innerHTML += `<div class="channel-comment"><strong>${c.userName}</strong>: ${c.text}</div>`;
                                });
                            } else if(commentsList) {
                                commentsList.innerHTML = '<i>💬 Нет комментариев</i>';
                            }
                        }
                        msgDiv.scrollTop = msgDiv.scrollHeight;
                        
                        document.querySelectorAll('.channel-comment-toggle').forEach(btn => {
                            btn.addEventListener('click', (e) => {
                                e.stopPropagation();
                                const msgId = btn.dataset.msgId;
                                const div = document.getElementById(`channel-comments-${msgId}`);
                                if(div) div.style.display = div.style.display === 'none' ? 'block' : 'none';
                            });
                        });
                        document.querySelectorAll('.add-channel-comment-btn').forEach(btn => {
                            btn.addEventListener('click', async (e) => {
                                e.stopPropagation();
                                const msgId = btn.dataset.msgId;
                                const input = document.getElementById(`channel-comment-input-${msgId}`);
                                if(input.value.trim()) {
                                    await addChannelComment(currentChannelId, msgId, input.value);
                                    delete channelCommentDrafts[msgId];
                                    const commentsList = document.getElementById(`channel-comments-list-${msgId}`);
                                    if(commentsList) {
                                        commentsList.innerHTML = '';
                                        const snap = await db.ref(`channels/${currentChannelId}/messages/${msgId}/comments`).once('value');
                                        if(snap.val()) {
                                            const comments = Object.values(snap.val());
                                            comments.sort((a,b) => a.timestamp - b.timestamp);
                                            comments.forEach(c => {
                                                commentsList.innerHTML += `<div class="channel-comment"><strong>${c.userName}</strong>: ${c.text}</div>`;
                                            });
                                        } else {
                                            commentsList.innerHTML = '<i>💬 Нет комментариев</i>';
                                        }
                                    }
                                    input.value = '';
                                }
                            });
                        });
                    } else if(type === 'group') {
                        msgDiv.innerHTML = msgs.map(m => `<div style="margin:8px 0; padding:8px; background:#ffe5c4; border-radius:20px;"><strong>${m.fromName || m.from}</strong>: ${m.text}</div>`).join('');
                    }
                    msgDiv.scrollTop = msgDiv.scrollHeight;
                }
            });
            currentMessagesRef = messagesRef;
            
            const inputField = document.getElementById('fullscreenMsgInput');
            const sendBtn = document.getElementById('fullscreenSendBtn');
            if(inputField) inputField.value = chatDraft;
            
            const sendMessage = async () => {
                const text = inputField.value;
                if(text.trim()) {
                    if(type === 'pm') await sendPrivateMessage(currentChatUserId, text);
                    else if(type === 'channel') { if(target.ownerId === currentUser.userId) await sendChannelMessage(currentChannelId, currentUser.userId, text); else { showToast('Только владелец может писать'); return; } }
                    else if(type === 'group') await sendGroupMessage(currentGroupId, currentUser.userId, text);
                    inputField.value = '';
                    chatDraft = '';
                }
            };
            
            sendBtn?.addEventListener('click', sendMessage);
            inputField?.addEventListener('keypress', (e) => { if(e.key === 'Enter') sendMessage(); });
            inputField?.addEventListener('input', (e) => { chatDraft = e.target.value; });
            
            if(type === 'channel' && target?.ownerId !== currentUser.userId) {
                inputField.disabled = true;
                inputField.placeholder = "🔒 Только для чтения";
                sendBtn.disabled = true;
            }
        }, 50);
        
        return `<div id="fullscreenChatContainer" class="fullscreen-chat"><div class="chat-header"><button id="closeFullscreenBtn" style="width: auto;"><i class="fas fa-arrow-left"></i> Назад</button>${avatarHtml}<div><strong>${title}</strong></div></div><div class="chat-messages-area" id="fullscreenMsgList"></div><div class="chat-input-area"><input type="text" id="fullscreenMsgInput" placeholder="Сообщение..." style="flex: 1;"><button id="fullscreenSendBtn" style="width: auto;">Отправить</button></div></div>`;
    }

    function renderSettingsTab() {
        return `<div class="card no-click"><h2>⚙️ Настройки</h2><div class="flex-between" style="margin-bottom: 20px;">${renderAvatar(currentUser.avatarIcon, currentUser.avatarBg)}<div><strong>${currentUser.nickname}</strong> @${currentUser.username} ${currentUser.verified ? '<i class="fas fa-check-circle verif-badge"></i>' : ''}</div></div><label>😊 Смайлик аватара: <input id="avatarIcon" value="${currentUser.avatarIcon || '🐱'}"></label><label>🎨 Цвет фона: <input type="color" id="avatarBg" value="${currentUser.avatarBg || '#ffb347'}"></label><button id="saveAvatarBtn">Сохранить аватар</button><button id="logoutBtn" style="background:#d9534f; margin-top: 20px;">🚪 Выйти из аккаунта</button></div>`;
    }

    function attachEvents() {
        document.querySelectorAll('.filter-btn').forEach(btn => { btn.addEventListener('click', async (e) => { e.stopPropagation(); postsFilter = btn.dataset.filter; renderApp(); }); });
        
        document.getElementById('createPostBtn')?.addEventListener('click', async (e) => { 
            e.stopPropagation(); 
            const textarea = document.getElementById('newPostText'); 
            if(textarea.value.trim()) { 
                await createPost(textarea.value); 
                postDraft = ''; 
                renderApp(); 
            } else {
                showToast('📝 Напишите текст поста');
            }
        });
        document.getElementById('newPostText')?.addEventListener('input', (e) => { postDraft = e.target.value; });
        
        document.querySelectorAll('.like-btn').forEach(btn => { btn.addEventListener('click', async (e) => { e.stopPropagation(); await toggleLike(btn.dataset.postId); renderApp(); }); });
        document.querySelectorAll('.comment-toggle-btn').forEach(btn => { btn.addEventListener('click', (e) => { e.stopPropagation(); const postId = btn.dataset.postId; const div = document.getElementById(`comments-${postId}`); if(div) div.style.display = div.style.display === 'none' ? 'block' : 'none'; }); });
        document.querySelectorAll('.add-post-comment-btn').forEach(btn => { btn.addEventListener('click', async (e) => { e.stopPropagation(); const postId = btn.dataset.postId; const input = document.getElementById(`comment-input-${postId}`); if(input.value.trim()) { await addPostComment(postId, input.value); delete commentDrafts[postId]; renderApp(); } }); });
        
        document.querySelectorAll('.openChatBtn').forEach(btn => { btn.addEventListener('click', (e) => { e.stopPropagation(); if(currentMessagesRef) { currentMessagesRef.off(); currentMessagesRef = null; } currentChatUserId = btn.dataset.userid; renderApp(); }); });
        document.querySelectorAll('.openChannelBtn').forEach(btn => { btn.addEventListener('click', (e) => { e.stopPropagation(); if(currentMessagesRef) { currentMessagesRef.off(); currentMessagesRef = null; } currentChannelId = btn.dataset.id; renderApp(); }); });
        document.querySelectorAll('.openGroupBtn').forEach(btn => { btn.addEventListener('click', (e) => { e.stopPropagation(); if(currentMessagesRef) { currentMessagesRef.off(); currentMessagesRef = null; } currentGroupId = btn.dataset.id; renderApp(); }); });
        
        document.getElementById('closeFullscreenBtn')?.addEventListener('click', (e) => { e.stopPropagation(); if(currentMessagesRef) { currentMessagesRef.off(); currentMessagesRef = null; } currentChatUserId = null; currentChannelId = null; currentGroupId = null; renderApp(); });
        
        document.getElementById('createChanBtn')?.addEventListener('click', async (e) => { e.stopPropagation(); const name = document.getElementById('newChanName').value; const uname = document.getElementById('newChanUsername').value; if(name && uname) { await createChannel(name, uname, currentUser.userId); renderApp(); } else showToast('Заполните все поля'); });
        document.getElementById('createGrpBtn')?.addEventListener('click', async (e) => { e.stopPropagation(); const name = document.getElementById('newGrpName').value; const uname = document.getElementById('newGrpUsername').value; if(name && uname) { await createGroup(name, uname, currentUser.userId); renderApp(); } else showToast('Заполните все поля'); });
        
        document.getElementById('searchUsersBtn')?.addEventListener('click', async (e) => { e.stopPropagation(); const query = document.getElementById('userSearchInput').value; if(query) { const results = await searchUsers(query); const container = document.getElementById('userSearchResults'); if(results.length === 0) container.innerHTML = '<div class="card no-click">❌ Пользователь не найден</div>'; else { container.innerHTML = `<h4>🔍 Результаты поиска:</h4>${results.map(u => `<div class="card flex-between">${renderAvatar(u.avatarIcon, u.avatarBg, 'avatar-sm')}<div><strong>${u.nickname}</strong> @${u.username} ${u.verified ? '<i class="fas fa-check-circle verif-badge"></i>' : ''}</div><button class="foundUserBtn" data-userid="${u.userId}">💬 Написать</button></div>`).join('')}`; document.querySelectorAll('.foundUserBtn').forEach(btn => { btn.addEventListener('click', async (e) => { e.stopPropagation(); if(currentMessagesRef) { currentMessagesRef.off(); currentMessagesRef = null; } currentChatUserId = btn.dataset.userid; renderApp(); }); }); } } });
        
        document.getElementById('searchChannelsBtn')?.addEventListener('click', async (e) => { e.stopPropagation(); const query = document.getElementById('channelSearchInput').value; if(query) { channelSearchResults = await searchChannels(query); renderApp(); } });
        document.querySelectorAll('.subChannelBtn').forEach(btn => { btn.addEventListener('click', async (e) => { e.stopPropagation(); await subscribeToChannel(btn.dataset.id, currentUser.userId); renderApp(); }); });
        
        document.getElementById('saveAvatarBtn')?.addEventListener('click', async (e) => { e.stopPropagation(); const icon = document.getElementById('avatarIcon').value; const bg = document.getElementById('avatarBg').value; await updateUserAvatar(icon, bg); renderApp(); });
        document.getElementById('logoutBtn')?.addEventListener('click', (e) => { e.stopPropagation(); currentUser = null; saveSession(null); if(currentMessagesRef) { currentMessagesRef.off(); currentMessagesRef = null; } renderApp(); });
    }
    
    window.openChat = (userId) => { if(currentMessagesRef) { currentMessagesRef.off(); currentMessagesRef = null; } currentChatUserId = userId; renderApp(); };

    (async function init() { const restored = await restoreSession(); if(restored) { currentUser = restored; initPresence(currentUser.userId); } renderApp(); })();
</script>
</body>
</html>
