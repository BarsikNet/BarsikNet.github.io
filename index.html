<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>BarsikNet 3.0 — Социальная сеть</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f7b05e 0%, #f28c38 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .app-container {
            width: 100%;
            max-width: 1400px;
            height: 90vh;
            background: rgba(255, 248, 225, 0.25);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 48px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(255, 255, 255, 0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            scroll-behavior: smooth;
        }

        .fullscreen-chat {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 245, 225, 0.98);
            backdrop-filter: blur(20px);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        .fullscreen-chat .chat-header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            background: rgba(255, 200, 120, 0.5);
            border-radius: 32px;
            margin-bottom: 16px;
        }
        .fullscreen-chat .chat-messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        .fullscreen-chat .chat-input-area {
            padding: 16px;
            display: flex;
            gap: 12px;
        }

        .tab-bar {
            background: rgba(30, 20, 15, 0.5);
            backdrop-filter: blur(30px);
            border-top: 1px solid rgba(255, 215, 150, 0.6);
            display: flex;
            justify-content: space-around;
            padding: 12px 16px 20px;
            border-radius: 32px 32px 0 0;
            gap: 8px;
        }

        .tab-item {
            flex: 1;
            text-align: center;
            color: #fff7e8;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 0;
            border-radius: 32px;
            transition: 0.2s;
            cursor: pointer;
            background: rgba(255, 200, 120, 0.2);
            backdrop-filter: blur(4px);
        }

        .tab-item i {
            display: block;
            font-size: 22px;
            margin-bottom: 4px;
        }

        .tab-item.active {
            background: #f57c00;
            color: white;
            box-shadow: 0 6px 14px rgba(0,0,0,0.2);
        }

        .auth-panel {
            background: rgba(255,245,225,0.9);
            border-radius: 40px;
            padding: 32px 24px;
            max-width: 480px;
            margin: 10% auto;
            backdrop-filter: blur(8px);
            box-shadow: 0 20px 35px rgba(0,0,0,0.2);
        }

        input, button, textarea {
            border: none;
            outline: none;
            border-radius: 60px;
            padding: 14px 18px;
            font-size: 16px;
            width: 100%;
            margin-top: 12px;
            background: rgba(255,255,240,0.9);
        }

        button {
            background: #f57c00;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:active { transform: scale(0.97); }

        .card {
            background: rgba(255, 235, 205, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 32px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid rgba(255,160,50,0.6);
        }

        .avatar-circle {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            flex-shrink: 0;
        }
        .avatar-sm {
            width: 48px;
            height: 48px;
            font-size: 28px;
        }

        .online-status {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-left: 8px;
        }
        .online { background: #2ecc71; box-shadow:0 0 6px #2ecc71; }
        .offline { background: #95a5a6; }

        .post-card {
            margin-bottom: 24px;
        }
        .post-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .post-actions {
            display: flex;
            gap: 24px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #ffcc88;
        }
        .post-actions button {
            width: auto;
            background: transparent;
            color: #f57c00;
            margin: 0;
            padding: 8px 16px;
        }
        .comments-section {
            margin-top: 12px;
            padding-left: 20px;
            border-left: 2px solid #f57c00;
        }
        .filter-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .filter-btn {
            background: #ffd8a8;
            color: #4a2a0e;
            width: auto;
            padding: 8px 24px;
        }
        .filter-btn.active {
            background: #f57c00;
            color: white;
        }
        .verif-badge { color: #3498db; margin-left: 6px; font-size: 14px; }
        .like-btn.liked { color: #e74c3c; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        
        @media (min-width: 1024px) {
            .app-container { width: 1000px; height: 85vh; }
        }
        @media (max-width: 600px) {
            .tab-item span { font-size: 10px; }
            .tab-item i { font-size: 20px; }
        }
        
        .toast-msg {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: #2c3e2f;
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            z-index: 999;
        }

        .msg-bubble {
            background: #f2a65a;
            border-radius: 24px;
            padding: 10px 14px;
            max-width: 70%;
        }
    </style>
</head>
<body>
<div class="app-container" id="appRoot"></div>

<script>
    const firebaseConfig = { databaseURL: "https://onlinesm1-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentUser = null;
    let activeTab = 'posts';
    let currentChatUserId = null;
    let currentChannelId = null;
    let currentGroupId = null;
    let searchResults = null;
    let postsFilter = 'new';
    let fullscreenMode = false;
    
    let messageListenerUnsub = null;
    let channelListenerUnsub = null;
    let groupListenerUnsub = null;

    // Сохранённый текст ввода (чтобы не терялся)
    let savedDraft = '';

    function showToast(msg) {
        let toast = document.createElement('div');
        toast.className = 'toast-msg';
        toast.innerText = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    }

    function getUserId(username) { return username.toLowerCase().replace(/[^a-z0-9]/g, '') + '_' + Date.now(); }
    
    function saveSession(user) {
        if(user) localStorage.setItem('barsik_session', JSON.stringify({ userId: user.userId, username: user.username }));
        else localStorage.removeItem('barsik_session');
    }

    function initPresence(userId) {
        const userStatusRef = db.ref(`/users/${userId}/online`);
        const connectedRef = db.ref('.info/connected');
        connectedRef.on('value', (snap) => {
            if(snap.val() === true) {
                userStatusRef.onDisconnect().set(false);
                userStatusRef.set(true);
            }
        });
    }

    async function registerUser(nickname, username, password) {
        const usersRef = db.ref('users');
        const snapshot = await usersRef.orderByChild('username').equalTo(username).once('value');
        if(snapshot.exists()) throw new Error('Юзернейм уже занят');
        const userId = getUserId(username);
        const newUser = {
            userId, nickname, username, password,
            avatarIcon: '🐱', avatarBg: '#ffb347', verified: false,
            online: true, createdAt: Date.now()
        };
        await usersRef.child(userId).set(newUser);
        return newUser;
    }

    async function loginUser(username, password) {
        const usersRef = db.ref('users');
        const snapshot = await usersRef.orderByChild('username').equalTo(username).once('value');
        if(!snapshot.exists()) throw new Error('Пользователь не найден');
        let userData = null;
        snapshot.forEach(child => { userData = child.val(); });
        if(userData.password !== password) throw new Error('Неверный пароль');
        return userData;
    }

    async function restoreSession() {
        const saved = localStorage.getItem('barsik_session');
        if(!saved) return null;
        const { userId } = JSON.parse(saved);
        const snap = await db.ref(`users/${userId}`).once('value');
        return snap.exists() ? snap.val() : null;
    }

    async function searchGlobal(query) {
        const usersSnap = await db.ref('users').orderByChild('username').equalTo(query).once('value');
        const channelsSnap = await db.ref('channels').orderByChild('username').equalTo(query).once('value');
        let users = [];
        usersSnap.forEach(u => users.push(u.val()));
        let channels = [];
        channelsSnap.forEach(ch => channels.push(ch.val()));
        return { users, channels };
    }

    async function getContacts() {
        const chatsRef = db.ref('chats');
        const snapshot = await chatsRef.once('value');
        const contacts = new Set();
        snapshot.forEach(chat => {
            const chatId = chat.key;
            const participants = chatId.split('_');
            if(participants.includes(currentUser.userId)) {
                const otherId = participants[0] === currentUser.userId ? participants[1] : participants[0];
                contacts.add(otherId);
            }
        });
        const contactUsers = [];
        for(let userId of contacts) {
            const userSnap = await db.ref(`users/${userId}`).once('value');
            if(userSnap.exists()) contactUsers.push(userSnap.val());
        }
        return contactUsers;
    }

    async function sendPrivateMessage(toUserId, text) {
        if(!text.trim()) return;
        const chatId = [currentUser.userId, toUserId].sort().join('_');
        const msgObj = { from: currentUser.userId, text, timestamp: Date.now() };
        await db.ref(`chats/${chatId}/messages`).push(msgObj);
    }

    async function listenMessagesWith(userId, callback) {
        const chatId = [currentUser.userId, userId].sort().join('_');
        const msgRef = db.ref(`chats/${chatId}/messages`);
        msgRef.off();
        msgRef.on('value', (snap) => {
            let msgs = [];
            snap.forEach(m => msgs.push({ id: m.key, ...m.val() }));
            msgs.sort((a,b)=>a.timestamp-b.timestamp);
            callback(msgs);
        });
        return () => msgRef.off();
    }

    // Посты
    async function createPost(text) {
        const postId = 'post_' + Date.now();
        const post = {
            postId,
            authorId: currentUser.userId,
            authorName: currentUser.nickname,
            authorUsername: currentUser.username,
            authorAvatar: currentUser.avatarIcon,
            authorBg: currentUser.avatarBg,
            text,
            likes: {},
            comments: [],
            timestamp: Date.now(),
            likesCount: 0
        };
        await db.ref(`posts/${postId}`).set(post);
        return post;
    }

    async function toggleLike(postId) {
        const postRef = db.ref(`posts/${postId}/likes/${currentUser.userId}`);
        const snapshot = await postRef.once('value');
        if(snapshot.exists()) {
            await postRef.remove();
        } else {
            await postRef.set(true);
        }
        // Обновляем счётчик лайков
        const likesSnap = await db.ref(`posts/${postId}/likes`).once('value');
        const count = likesSnap.exists() ? likesSnap.numChildren() : 0;
        await db.ref(`posts/${postId}/likesCount`).set(count);
    }

    async function addComment(postId, text) {
        const comment = {
            userId: currentUser.userId,
            userName: currentUser.nickname,
            text,
            timestamp: Date.now()
        };
        await db.ref(`posts/${postId}/comments`).push(comment);
    }

    async function getPosts(order = 'new') {
        const snapshot = await db.ref('posts').once('value');
        let posts = [];
        snapshot.forEach(p => posts.push(p.val()));
        if(order === 'new') posts.sort((a,b) => b.timestamp - a.timestamp);
        else posts.sort((a,b) => (b.likesCount || 0) - (a.likesCount || 0));
        return posts;
    }

    // Каналы
    async function createChannel(channelName, channelUsername, ownerId) {
        const chanId = 'chan_'+Date.now();
        const newChan = {
            channelId: chanId, name: channelName, username: channelUsername,
            ownerId: ownerId, subscribers: { [ownerId]: true }, verified: false, messages: []
        };
        await db.ref(`channels/${chanId}`).set(newChan);
        return newChan;
    }

    async function subscribeToChannel(channelId, userId) {
        await db.ref(`channels/${channelId}/subscribers/${userId}`).set(true);
    }

    async function sendChannelMessage(channelId, userId, text) {
        const chanSnap = await db.ref(`channels/${channelId}`).once('value');
        if(chanSnap.val().ownerId !== userId) throw new Error('Только владелец может писать');
        await db.ref(`channels/${channelId}/messages`).push({ from: userId, text, timestamp: Date.now() });
    }

    function listenChannelMessages(channelId, callback) {
        db.ref(`channels/${channelId}/messages`).on('value', (snap) => {
            let msgs = [];
            snap.forEach(m => msgs.push(m.val()));
            msgs.sort((a,b)=>a.timestamp-b.timestamp);
            callback(msgs);
        });
    }

    // Группы
    async function createGroup(groupName, groupUsername, ownerId) {
        const groupId = 'grp_'+Date.now();
        const newGrp = {
            groupId, name: groupName, username: groupUsername, ownerId,
            members: { [ownerId]: true }, messages: []
        };
        await db.ref(`groups/${groupId}`).set(newGrp);
        return newGrp;
    }

    async function addMemberToGroup(groupId, memberUserId) {
        await db.ref(`groups/${groupId}/members/${memberUserId}`).set(true);
    }

    async function sendGroupMessage(groupId, userId, text) {
        const grpSnap = await db.ref(`groups/${groupId}`).once('value');
        if(!grpSnap.val().members[userId]) throw new Error('Вы не участник');
        await db.ref(`groups/${groupId}/messages`).push({ from: userId, text, timestamp: Date.now() });
    }

    function listenGroupMessages(groupId, callback) {
        db.ref(`groups/${groupId}/messages`).on('value', (snap) => {
            let msgs = [];
            snap.forEach(m => msgs.push(m.val()));
            msgs.sort((a,b)=>a.timestamp-b.timestamp);
            callback(msgs);
        });
    }

    async function updateUserAvatar(icon, bgColor) {
        await db.ref(`users/${currentUser.userId}/avatarIcon`).set(icon);
        await db.ref(`users/${currentUser.userId}/avatarBg`).set(bgColor);
        currentUser.avatarIcon = icon;
        currentUser.avatarBg = bgColor;
        showToast('Аватар обновлён');
    }

    function renderAvatar(icon, bgColor, sizeClass = '') {
        return `<div class="avatar-circle ${sizeClass}" style="background-color: ${bgColor || '#ffb347'};">${icon || '🐱'}</div>`;
    }

    // === ОТРИСОВКА ВКЛАДОК ===
    async function renderPostsTab() {
        const posts = await getPosts(postsFilter);
        const postsHtml = posts.map(post => `
            <div class="card post-card" data-post-id="${post.postId}">
                <div class="post-header">
                    ${renderAvatar(post.authorAvatar, post.authorBg, 'avatar-sm')}
                    <div>
                        <strong>${post.authorName}</strong> @${post.authorUsername} ${post.authorVerified ? '<i class="fas fa-check-circle verif-badge"></i>' : ''}
                        <div style="font-size: 12px; color: #6b4c2a;">${new Date(post.timestamp).toLocaleString()}</div>
                    </div>
                </div>
                <p style="font-size: 16px; margin: 12px 0;">${post.text}</p>
                <div class="post-actions">
                    <button class="like-btn" data-post-id="${post.postId}"><i class="fas fa-heart"></i> ${post.likesCount || 0}</button>
                    <button class="comment-toggle-btn" data-post-id="${post.postId}"><i class="fas fa-comment"></i> Комментировать</button>
                </div>
                <div class="comments-section" id="comments-${post.postId}" style="display: none;">
                    <div id="comments-list-${post.postId}">
                        ${post.comments && post.comments.length ? post.comments.map(c => `<div><strong>${c.userName}</strong>: ${c.text}</div>`).join('') : '<i>Нет комментариев</i>'}
                    </div>
                    <div class="flex-between" style="margin-top: 12px;">
                        <input type="text" id="comment-input-${post.postId}" placeholder="Ваш комментарий...">
                        <button class="add-comment-btn" data-post-id="${post.postId}" style="width: auto;">→</button>
                    </div>
                </div>
            </div>
        `).join('');
        
        return `
            <div class="filter-buttons">
                <button class="filter-btn ${postsFilter === 'new' ? 'active' : ''}" data-filter="new">📅 Новые</button>
                <button class="filter-btn ${postsFilter === 'popular' ? 'active' : ''}" data-filter="popular">🔥 Популярные</button>
            </div>
            <div class="card">
                <textarea id="newPostText" rows="3" placeholder="Что нового, кот? 🐱"></textarea>
                <button id="createPostBtn">📝 Опубликовать пост</button>
            </div>
            <div id="postsList">${postsHtml}</div>
        `;
    }

    async function renderChatsTab() {
        if(currentChatUserId) {
            return await renderFullscreenChat();
        }
        const contacts = await getContacts();
        const contactsHtml = contacts.map(async u => {
            const status = (await db.ref(`users/${u.userId}/online`).once('value')).val();
            return `
                <div class="card user-row" style="display: flex; align-items: center; gap: 12px;">
                    ${renderAvatar(u.avatarIcon, u.avatarBg, 'avatar-sm')}
                    <div style="flex:1">
                        <strong>${u.nickname}</strong> @${u.username} ${u.verified ? '<i class="fas fa-check-circle verif-badge"></i>' : ''}<br>
                        <span><span class="online-status ${status ? 'online' : 'offline'}"></span> ${status ? 'В сети' : 'Не в сети'}</span>
                    </div>
                    <button class="openChatBtn" data-userid="${u.userId}" data-name="${u.nickname}">💬</button>
                </div>
            `;
        });
        const resolved = await Promise.all(contactsHtml);
        return `<h2><i class="fas fa-comment-dots"></i> Личные сообщения</h2>
                <div>${resolved.length ? resolved.join('') : '<div class="card">Напишите кому-нибудь через поиск, чтобы начать диалог</div>'}</div>`;
    }

    async function renderFullscreenChat() {
        const targetSnap = await db.ref(`users/${currentChatUserId}`).once('value');
        const target = targetSnap.val();
        if(!target) return '<div>Пользователь не найден</div>';
        
        // Создаём временный контейнер для полноэкранного чата
        setTimeout(() => {
            const chatContainer = document.getElementById('fullscreenChatContainer');
            if(!chatContainer) return;
            
            let msgDiv = document.getElementById('fullscreenMsgList');
            if(msgDiv) {
                if(messageListenerUnsub) messageListenerUnsub();
                listenMessagesWith(currentChatUserId, (msgs) => {
                    const currentMsgDiv = document.getElementById('fullscreenMsgList');
                    if(currentMsgDiv) {
                        currentMsgDiv.innerHTML = msgs.map(m => `
                            <div style="display: flex; justify-content: ${m.from === currentUser.userId ? 'flex-end' : 'flex-start'}; margin: 8px 0;">
                                <div class="msg-bubble" style="background: ${m.from === currentUser.userId ? '#faa75e' : '#ffe1b3'}">
                                    ${m.text}<br><small style="opacity:0.7">${new Date(m.timestamp).toLocaleTimeString()}</small>
                                </div>
                            </div>
                        `).join('');
                        currentMsgDiv.scrollTop = currentMsgDiv.scrollHeight;
                    }
                }).then(unsub => { messageListenerUnsub = unsub; });
            }
            
            const inputField = document.getElementById('fullscreenMsgInput');
            const sendBtn = document.getElementById('fullscreenSendBtn');
            
            const sendMessage = async () => {
                const text = inputField.value;
                if(text.trim()) {
                    await sendPrivateMessage(currentChatUserId, text);
                    inputField.value = '';
                    savedDraft = '';
                }
            };
            
            sendBtn?.addEventListener('click', sendMessage);
            inputField?.addEventListener('keypress', (e) => {
                if(e.key === 'Enter') sendMessage();
            });
            // Сохраняем черновик
            inputField?.addEventListener('input', (e) => { savedDraft = e.target.value; });
            if(savedDraft) inputField.value = savedDraft;
            
        }, 50);
        
        return `
            <div id="fullscreenChatContainer" class="fullscreen-chat">
                <div class="chat-header">
                    <button id="closeFullscreenBtn" style="width: auto; background: #ffaa66;"><i class="fas fa-arrow-left"></i> Назад</button>
                    ${renderAvatar(target.avatarIcon, target.avatarBg, 'avatar-sm')}
                    <div><strong>${target.nickname}</strong> @${target.username}</div>
                </div>
                <div class="chat-messages-area" id="fullscreenMsgList" style="flex: 1; overflow-y: auto;"></div>
                <div class="chat-input-area">
                    <input type="text" id="fullscreenMsgInput" placeholder="Сообщение..." style="flex: 1;">
                    <button id="fullscreenSendBtn" style="width: auto;">Отправить</button>
                </div>
            </div>
        `;
    }

    async function renderChannelsTab() {
        if(currentChannelId) {
            return await renderFullscreenChannel();
        }
        const channelsSnap = await db.ref('channels').once('value');
        let channels = [];
        channelsSnap.forEach(ch => channels.push(ch.val()));
        const mySubs = channels.filter(c => c.subscribers && c.subscribers[currentUser.userId]);
        return `<h2><i class="fas fa-bullhorn"></i> Мои каналы</h2>
                ${mySubs.map(c => `<div class="card"><strong>📢 ${c.name}</strong> @${c.username} ${c.verified ? '<i class="fas fa-check-circle verif-badge"></i>' : ''}<br><button class="openChannelBtn" data-id="${c.channelId}">Открыть</button></div>`).join('')}
                <h3>Создать канал</h3><input id="newChanName" placeholder="Название"><input id="newChanUsername" placeholder="Юзернейм"><button id="createChanBtn">Создать</button>`;
    }

    async function renderFullscreenChannel() {
        const chanSnap = await db.ref(`channels/${currentChannelId}`).once('value');
        const chan = chanSnap.val();
        
        setTimeout(() => {
            const container = document.getElementById('fullscreenChatContainer');
            if(!container) return;
            
            listenChannelMessages(currentChannelId, (msgs) => {
                const msgDiv = document.getElementById('fullscreenMsgList');
                if(msgDiv) {
                    msgDiv.innerHTML = msgs.map(m => `<div class="msg-bubble" style="margin:8px 0;">📢 ${m.text}<br><small>от @${m.from}</small></div>`).join('');
                    msgDiv.scrollTop = msgDiv.scrollHeight;
                }
            });
            
            const inputField = document.getElementById('fullscreenMsgInput');
            const sendBtn = document.getElementById('fullscreenSendBtn');
            if(chan.ownerId !== currentUser.userId && sendBtn) {
                sendBtn.disabled = true;
                inputField.disabled = true;
                inputField.placeholder = "Только для чтения";
            } else {
                sendBtn?.addEventListener('click', async () => {
                    const text = inputField.value;
                    if(text) {
                        try {
                            await sendChannelMessage(currentChannelId, currentUser.userId, text);
                            inputField.value = '';
                        } catch(e) { showToast(e.message); }
                    }
                });
            }
        }, 50);
        
        return `
            <div id="fullscreenChatContainer" class="fullscreen-chat">
                <div class="chat-header">
                    <button id="closeFullscreenBtn" style="width: auto;"><i class="fas fa-arrow-left"></i> Назад</button>
                    <div><strong>📺 ${chan.name}</strong> @${chan.username}</div>
                </div>
                <div class="chat-messages-area" id="fullscreenMsgList" style="flex: 1; overflow-y: auto;"></div>
                <div class="chat-input-area">
                    <input type="text" id="fullscreenMsgInput" placeholder="${chan.ownerId === currentUser.userId ? 'Сообщение в канал...' : 'Только чтение'}" style="flex: 1;">
                    <button id="fullscreenSendBtn" style="width: auto;">📢</button>
                </div>
            </div>
        `;
    }

    async function renderGroupsTab() {
        if(currentGroupId) {
            return await renderFullscreenGroup();
        }
        const groupsSnap = await db.ref('groups').once('value');
        let groups = [];
        groupsSnap.forEach(g => groups.push(g.val()));
        const myGroups = groups.filter(g => g.members && g.members[currentUser.userId]);
        return `<h2>👥 Группы</h2>${myGroups.map(g => `<div class="card"><strong>${g.name}</strong> @${g.username}<br><button class="openGroupBtn" data-id="${g.groupId}">Войти</button></div>`).join('')}
                <h3>Создать группу</h3><input id="newGrpName" placeholder="Название"><input id="newGrpUsername" placeholder="Юзернейм"><button id="createGrpBtn">Создать</button>`;
    }

    async function renderFullscreenGroup() {
        const grpSnap = await db.ref(`groups/${currentGroupId}`).once('value');
        const group = grpSnap.val();
        
        setTimeout(() => {
            listenGroupMessages(currentGroupId, (msgs) => {
                const msgDiv = document.getElementById('fullscreenMsgList');
                if(msgDiv) {
                    msgDiv.innerHTML = msgs.map(m => `<div style="margin:8px 0; padding:8px; background:#ffe5c4; border-radius:20px;"><strong>${m.from}</strong>: ${m.text}</div>`).join('');
                    msgDiv.scrollTop = msgDiv.scrollHeight;
                }
            });
            
            const inputField = document.getElementById('fullscreenMsgInput');
            const sendBtn = document.getElementById('fullscreenSendBtn');
            sendBtn?.addEventListener('click', async () => {
                const text = inputField.value;
                if(text) {
                    await sendGroupMessage(currentGroupId, currentUser.userId, text);
                    inputField.value = '';
                }
            });
        }, 50);
        
        return `
            <div id="fullscreenChatContainer" class="fullscreen-chat">
                <div class="chat-header">
                    <button id="closeFullscreenBtn" style="width: auto;"><i class="fas fa-arrow-left"></i> Назад</button>
                    <div><strong>👥 ${group.name}</strong></div>
                    <button id="groupInfoBtn" style="width: auto; background: #ffaa66;" onclick="alert('Владелец может добавлять участников через профиль группы')">ℹ️ О группе</button>
                </div>
                <div class="chat-messages-area" id="fullscreenMsgList" style="flex: 1; overflow-y: auto;"></div>
                <div class="chat-input-area">
                    <input type="text" id="fullscreenMsgInput" placeholder="Сообщение..." style="flex: 1;">
                    <button id="fullscreenSendBtn" style="width: auto;">Отправить</button>
                </div>
            </div>
        `;
    }

    async function renderSearchTab() {
        let resultsHtml = '';
        if(searchResults) {
            resultsHtml = `<h4>Люди:</h4>${searchResults.users.map(u => `<div class="card flex-between">${renderAvatar(u.avatarIcon, u.avatarBg, 'avatar-sm')}<div><strong>${u.nickname}</strong> @${u.username}</div><button class="msgUserBtn" data-id="${u.userId}">Написать</button></div>`).join('')}
            <h4>Каналы:</h4>${searchResults.channels.map(c => `<div class="card flex-between"><div><strong>📢 ${c.name}</strong> @${c.username}</div><button class="subChannelBtn" data-id="${c.channelId}">Подписаться</button></div>`).join('')}`;
        }
        return `<div class="search-box"><input id="searchInput" placeholder="Поиск по юзернейму..."><button id="doSearchBtn">🔍 Найти</button></div>${resultsHtml}`;
    }

    function renderSettingsTab() {
        return `<div class="card">
            <h2>⚙️ Настройки профиля</h2>
            <div class="flex-between" style="justify-content: flex-start; gap: 20px; margin-bottom: 20px;">
                ${renderAvatar(currentUser.avatarIcon, currentUser.avatarBg)}
                <div><strong>${currentUser.nickname}</strong> @${currentUser.username}</div>
            </div>
            <label>Смайлик: <input id="avatarIcon" value="${currentUser.avatarIcon || '🐱'}"></label>
            <label>Цвет фона: <input type="color" id="avatarBg" value="${currentUser.avatarBg || '#ffb347'}"></label>
            <button id="saveAvatarBtn">Сохранить аватар</button>
            <button id="logoutBtn" style="background:#d9534f; margin-top: 20px;">🚪 Выйти</button>
        </div>`;
    }

    // Обработчики событий
    function attachEvents() {
        // Фильтры постов
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                postsFilter = btn.dataset.filter;
                await renderApp();
            });
        });
        
        // Создание поста
        document.getElementById('createPostBtn')?.addEventListener('click', async () => {
            const text = document.getElementById('newPostText').value;
            if(text) {
                await createPost(text);
                document.getElementById('newPostText').value = '';
                await renderApp();
            }
        });
        
        // Лайки и комментарии (делегирование)
        document.querySelectorAll('.like-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                const postId = btn.dataset.postId;
                await toggleLike(postId);
                await renderApp();
            });
        });
        
        document.querySelectorAll('.comment-toggle-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const postId = btn.dataset.postId;
                const commentsDiv = document.getElementById(`comments-${postId}`);
                if(commentsDiv) commentsDiv.style.display = commentsDiv.style.display === 'none' ? 'block' : 'none';
            });
        });
        
        document.querySelectorAll('.add-comment-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                const postId = btn.dataset.postId;
                const input = document.getElementById(`comment-input-${postId}`);
                if(input.value) {
                    await addComment(postId, input.value);
                    input.value = '';
                    await renderApp();
                }
            });
        });
        
        // Чаты
        document.querySelectorAll('.openChatBtn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentChatUserId = btn.dataset.userid;
                renderApp();
            });
        });
        
        document.querySelectorAll('.openChannelBtn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentChannelId = btn.dataset.id;
                renderApp();
            });
        });
        
        document.querySelectorAll('.openGroupBtn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentGroupId = btn.dataset.id;
                renderApp();
            });
        });
        
        document.getElementById('closeFullscreenBtn')?.addEventListener('click', () => {
            currentChatUserId = null;
            currentChannelId = null;
            currentGroupId = null;
            if(messageListenerUnsub) { messageListenerUnsub(); messageListenerUnsub = null; }
            renderApp();
        });
        
        document.getElementById('createChanBtn')?.addEventListener('click', async () => {
            const name = document.getElementById('newChanName').value;
            const uname = document.getElementById('newChanUsername').value;
            if(name && uname) {
                await createChannel(name, uname, currentUser.userId);
                renderApp();
            }
        });
        
        document.getElementById('createGrpBtn')?.addEventListener('click', async () => {
            const name = document.getElementById('newGrpName').value;
            const uname = document.getElementById('newGrpUsername').value;
            if(name && uname) {
                await createGroup(name, uname, currentUser.userId);
                renderApp();
            }
        });
        
        document.getElementById('doSearchBtn')?.addEventListener('click', async () => {
            const q = document.getElementById('searchInput').value;
            if(q) {
                searchResults = await searchGlobal(q);
                renderApp();
            }
        });
        
        document.querySelectorAll('.msgUserBtn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentChatUserId = btn.dataset.id;
                activeTab = 'chats';
                renderApp();
            });
        });
        
        document.querySelectorAll('.subChannelBtn').forEach(btn => {
            btn.addEventListener('click', async () => {
                await subscribeToChannel(btn.dataset.id, currentUser.userId);
                showToast('Подписан на канал');
                renderApp();
            });
        });
        
        document.getElementById('saveAvatarBtn')?.addEventListener('click', async () => {
            const icon = document.getElementById('avatarIcon').value;
            const bg = document.getElementById('avatarBg').value;
            await updateUserAvatar(icon, bg);
            renderApp();
        });
        
        document.getElementById('logoutBtn')?.addEventListener('click', () => {
            currentUser = null;
            saveSession(null);
            renderApp();
        });
    }

    async function renderApp() {
        const root = document.getElementById('appRoot');
        if(!currentUser) {
            // Форма входа (упрощённо)
            root.innerHTML = `
                <div class="auth-panel">
                    <h2 style="text-align:center">🐾 BarsikNet 3.0</h2>
                    <div style="display:flex; gap:10px; margin:20px 0;">
                        <button id="showLoginBtn">Вход</button>
                        <button id="showRegBtn">Регистрация</button>
                    </div>
                    <div id="authForm">
                        <input type="text" id="loginUsername" placeholder="Юзернейм">
                        <input type="password" id="loginPassword" placeholder="Пароль">
                        <button id="doLoginBtn">Войти</button>
                    </div>
                </div>
            `;
            document.getElementById('showLoginBtn')?.addEventListener('click', () => {
                document.getElementById('authForm').innerHTML = `<input type="text" id="loginUsername" placeholder="Юзернейм"><input type="password" id="loginPassword" placeholder="Пароль"><button id="doLoginBtn">Войти</button>`;
                document.getElementById('doLoginBtn')?.addEventListener('click', async () => {
                    try {
                        currentUser = await loginUser(document.getElementById('loginUsername').value, document.getElementById('loginPassword').value);
                        saveSession(currentUser);
                        initPresence(currentUser.userId);
                        renderApp();
                    } catch(e) { showToast(e.message); }
                });
            });
            document.getElementById('showRegBtn')?.addEventListener('click', () => {
                document.getElementById('authForm').innerHTML = `<input type="text" id="regNick" placeholder="Никнейм"><input type="text" id="regUsername" placeholder="Юзернейм"><input type="password" id="regPassword" placeholder="Пароль"><button id="doRegBtn">Зарегистрироваться</button>`;
                document.getElementById('doRegBtn')?.addEventListener('click', async () => {
                    try {
                        currentUser = await registerUser(document.getElementById('regNick').value, document.getElementById('regUsername').value, document.getElementById('regPassword').value);
                        saveSession(currentUser);
                        initPresence(currentUser.userId);
                        renderApp();
                    } catch(e) { showToast(e.message); }
                });
            });
            return;
        }
        
        let mainView = '';
        if(activeTab === 'posts') mainView = await renderPostsTab();
        else if(activeTab === 'chats') mainView = await renderChatsTab();
        else if(activeTab === 'channels') mainView = await renderChannelsTab();
        else if(activeTab === 'groups') mainView = await renderGroupsTab();
        else if(activeTab === 'search') mainView = await renderSearchTab();
        else if(activeTab === 'settings') mainView = renderSettingsTab();
        
        root.innerHTML = `
            <div class="main-content" id="mainContent">${mainView}</div>
            <div class="tab-bar">
                <div class="tab-item ${activeTab==='posts'?'active':''}" data-tab="posts"><i class="fas fa-newspaper"></i><span>Посты</span></div>
                <div class="tab-item ${activeTab==='chats'?'active':''}" data-tab="chats"><i class="fas fa-comment-dots"></i><span>ЛС</span></div>
                <div class="tab-item ${activeTab==='channels'?'active':''}" data-tab="channels"><i class="fas fa-bullhorn"></i><span>Каналы</span></div>
                <div class="tab-item ${activeTab==='groups'?'active':''}" data-tab="groups"><i class="fas fa-users"></i><span>Группы</span></div>
                <div class="tab-item ${activeTab==='search'?'active':''}" data-tab="search"><i class="fas fa-search"></i><span>Поиск</span></div>
                <div class="tab-item ${activeTab==='settings'?'active':''}" data-tab="settings"><i class="fas fa-cog"></i><span>Настройки</span></div>
            </div>
        `;
        
        document.querySelectorAll('.tab-item').forEach(tab => {
            tab.addEventListener('click', () => {
                activeTab = tab.dataset.tab;
                currentChatUserId = null;
                currentChannelId = null;
                currentGroupId = null;
                if(messageListenerUnsub) { messageListenerUnsub(); messageListenerUnsub = null; }
                renderApp();
            });
        });
        
        attachEvents();
    }

    (async function init() {
        const restored = await restoreSession();
        if(restored) {
            currentUser = restored;
            initPresence(currentUser.userId);
        }
        renderApp();
    })();
</script>
</body>
</html>
